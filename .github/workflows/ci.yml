name: CI

# Manual trigger only. The same checks run locally: `lake build` and the
# scripts in verify/. Start a run from the Actions tab or with
# `gh workflow run CI`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1

  verify:
    name: Numerical checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run every script in verify/
        run: |
          shopt -s nullglob
          for script in verify/*.py; do
            echo "::group::$script"
            python3 "$script"
            echo "::endgroup::"
          done
